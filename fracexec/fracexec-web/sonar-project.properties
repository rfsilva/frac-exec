# SonarCloud — FracExec Web
# Substituir YOUR_ORG pelo slug da organização criada em sonarcloud.io

sonar.projectKey=YOUR_ORG_fracexec-web
sonar.organization=YOUR_ORG
sonar.projectName=FracExec Web
sonar.projectVersion=1.0

# Código-fonte TypeScript/SCSS
sonar.sources=src
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.spec.ts,\
  **/environments/**,\
  **/*.stories.ts

# Testes
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Relatório de cobertura gerado pelo Vitest (via ng test --configuration=ci)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
