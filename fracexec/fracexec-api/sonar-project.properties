# SonarCloud — FracExec API
# Substituir YOUR_ORG pelo slug da organização criada em sonarcloud.io

sonar.projectKey=YOUR_ORG_fracexec-api
sonar.organization=YOUR_ORG
sonar.projectName=FracExec API
sonar.projectVersion=1.0

# Código-fonte e testes
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=21
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Relatório de cobertura gerado pelo JaCoCo (via mvn verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusões — config/model/DTOs raramente contêm lógica testável
sonar.exclusions=\
  **/config/**,\
  **/shared/config/**,\
  **/*Application.java,\
  **/db/migration/**

sonar.cpd.exclusions=\
  **/*Repository.java,\
  **/*Entity.java

# Encoding
sonar.sourceEncoding=UTF-8
