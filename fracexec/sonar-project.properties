# SonarCloud — FracExec (monorepo)
# Substituir YOUR_ORG pelo slug da organização criada em sonarcloud.io

sonar.projectKey=rfsilvasonarcloudkey_frac-exec
sonar.organization=rfsilvasonarcloudkey
sonar.projectName=FracExec

# Código-fonte: backend Java + frontend TypeScript
sonar.sources=fracexec-api/src/main/java,fracexec-web/src
sonar.tests=fracexec-api/src/test/java,fracexec-web/src
sonar.test.inclusions=**/*.spec.ts

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/target/**,\
  **/*Application.java,\
  **/config/**,\
  **/shared/config/**,\
  **/db/migration/**,\
  **/environments/**

# Cobertura backend (JaCoCo)
sonar.java.source=21
sonar.java.binaries=fracexec-api/target/classes
sonar.java.test.binaries=fracexec-api/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=fracexec-api/target/site/jacoco/jacoco.xml

# Cobertura frontend (lcov gerado pelo ng test --configuration=ci)
sonar.javascript.lcov.reportPaths=fracexec-web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=fracexec-web/coverage/lcov.info

sonar.sourceEncoding=UTF-8
