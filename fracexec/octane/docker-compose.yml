version: "3.8"

# ALM Octane Stack — FracExec simulation
# Elasticsearch 7.x com transport (porta 9300) habilitado para o Octane

services:

  octane-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: octane-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "OctaneIsTheBest1!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - octane_mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'OctaneIsTheBest1!' -Q 'SELECT 1' -C -No 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'OctaneIsTheBest1!' -Q 'SELECT 1' 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 15

  octane-es:
    image: elasticsearch:8.14.3
    container_name: octane-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=elasticsearch
      - network.host=0.0.0.0
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - octane_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  octane:
    image: lifecyclemanagement/octane:latest
    container_name: fracexec-octane
    depends_on:
      octane-mssql:
        condition: service_healthy
      octane-es:
        condition: service_healthy
    environment:
      APP_URL: "http://localhost:8090"
      DB_TYPE: "MSSQL"
      DB_SERVER_NAME: "octane-mssql"
      DB_SERVER_PORT: "1433"
      DB_ADMIN_USER: "sa"
      DB_ADMIN_PASSWORD: "OctaneIsTheBest1!"
      SCHEMA_NAME: "sadb_octane"
      SCHEMA_PASSWORD: "Octane2026!"
      ELASTIC_HOST: "octane-es"
      ELASTIC_PORT: "9300"
      ELASTIC_HTTP_PORT: "9200"
      ELASTIC_CLUSTER_NAME: "elasticsearch"
      ELASTIC_SNIFF: "false"
    ports:
      - "8090:8080"
    volumes:
      - octane_conf:/opt/octane/conf
      - octane_log:/opt/octane/log
      - octane_repo:/opt/octane/repo
    restart: unless-stopped

volumes:
  octane_mssql_data:
  octane_es_data:
  octane_conf:
  octane_log:
  octane_repo:
