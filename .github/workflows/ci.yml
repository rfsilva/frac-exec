name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Maven + Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para análise completa do SonarCloud

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with coverage (JaCoCo)
        working-directory: fracexec/fracexec-api
        run: mvn verify -q
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: SonarCloud Scan — Backend
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: fracexec/fracexec-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACKEND }}

  frontend:
    name: Frontend (Angular Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para análise completa do SonarCloud

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fracexec/fracexec-web/package-lock.json

      - name: Install dependencies
        working-directory: fracexec/fracexec-web
        run: npm ci

      - name: Run tests with coverage
        working-directory: fracexec/fracexec-web
        run: npx ng test --configuration=ci --watch=false

      - name: Build Angular
        working-directory: fracexec/fracexec-web
        run: npx ng build --configuration=production

      - name: SonarCloud Scan — Frontend
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: fracexec/fracexec-web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}

  docker:
    name: Docker Build (API)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        working-directory: fracexec/fracexec-api
        run: |
          docker build -t $ECR_REGISTRY/fracexec-api:$IMAGE_TAG \
                       -t $ECR_REGISTRY/fracexec-api:latest .
          docker push $ECR_REGISTRY/fracexec-api --all-tags
